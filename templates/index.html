<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Consultas SQL</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f3f3f3;
      }

      .contenedor {
        width: 95%;
        margin: 25px auto;
      }

      h2 {
        color: #2c3e50;
        margin-bottom: 20px;
      }

      .panel {
        background: white;
        border: 1px solid #c8c8c8;
        border-radius: 5px;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      textarea {
        width: 100%;
        height: 130px;
        border: 1px solid #bcbcbc;
        padding: 10px;
        font-size: 15px;
        resize: vertical;
        border-radius: 4px;
      }

      button {
        margin-top: 15px;
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
      }

      button:hover {
        background: #0056b3;
      }

      .mensaje {
        margin-top: 15px;
        padding: 10px;
        background: #eaf6ff;
        border: 1px solid #8ec5ff;
        color: #0b4c8c;
        border-radius: 4px;
      }

      .tabla {
        margin-top: 25px;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }

      th {
        background: #d9edf7;
        color: #1f4e79;
        padding: 10px;
        border: 1px solid #c8d7e1;
        text-align: left;
      }

      td {
        padding: 8px;
        border: 1px solid #ddd;
      }

      tr:nth-child(even) {
        background: #f8f8f8;
      }

      tr:hover {
        background: #fff8d5;
      }
    </style>
  </head>

  <body>
    <div class="contenedor">
      <div class="panel">
        <h2>CONSULTAS SQL</h2>

        <form method="POST">
          <textarea name="consulta">{{ consulta }}</textarea>

          <button type="submit">Ejecutar Consulta</button>
        </form>

        {% if mensaje %}
        <div class="mensaje">{{ mensaje }}</div>
        {% endif %}
      </div>

      {% if columnas %}

      <div class="tabla">
        <table>
          <tr>
            {% for c in columnas %}
            <th>{{ c }}</th>
            {% endfor %}
          </tr>

          {% for fila in resultados %}

          <tr>
            {% for dato in fila %}
            <td>{{ dato }}</td>
            {% endfor %}
          </tr>

          {% endfor %}
        </table>
      </div>

      {% endif %}
    </div>
  </body>
</html>
